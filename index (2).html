<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AntiFraude System</title>

<link rel="stylesheet" href="style.css">

<style>
body{
    font-family: Arial, sans-serif;
    background:#0f172a;
    color:#fff;
    margin:0;
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
}

h1{
    text-align:center;
    margin-bottom:30px;
}

.card{
    background:#1e293b;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
}

label{
    display:block;
    margin-bottom:5px;
}

input{
    width:100%;
    padding:10px;
    border:none;
    border-radius:6px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#22c55e;
    color:white;
    font-weight:bold;
    cursor:pointer;
    margin-top:15px;
}

button:hover{
    opacity:.9;
}

.resultado{
    margin-top:20px;
}

.box{
    background:#334155;
    padding:15px;
    border-radius:10px;
    margin-bottom:10px;
}

.aprovado{
    color:#22c55e;
    font-weight:bold;
}

.alerta{
    color:#facc15;
    font-weight:bold;
}

.reprovado{
    color:#ef4444;
    font-weight:bold;
}
</style>

</head>
<body>

<div class="container">

<h1>⚽ AntiFraude System</h1>

<div class="card">

<h2>Dados da Partida</h2>

<div class="grid">

<div>
<label>Time Casa</label>
<input id="timeCasa" placeholder="Ex: Flamengo">
</div>

<div>
<label>Time Visitante</label>
<input id="timeFora" placeholder="Ex: Palmeiras">
</div>

<div>
<label>xG Casa</label>
<input id="xgCasa" type="number" step="0.01" value="1.50">
</div>

<div>
<label>xG Visitante</label>
<input id="xgFora" type="number" step="0.01" value="1.20">
</div>

<div>
<label>Finalizações Casa</label>
<input id="finCasa" type="number" value="14">
</div>

<div>
<label>Finalizações Visitante</label>
<input id="finFora" type="number" value="10">
</div>

<div>
<label>Escanteios Casa</label>
<input id="escCasa" type="number" value="6">
</div>

<div>
<label>Escanteios Visitante</label>
<input id="escFora" type="number" value="4">
</div>

</div>

<button onclick="calcularScanner()">
🚀 Executar Scanner AntiFraude
</button>

</div>

<div id="resultado" class="resultado"></div>

</div>

<script>

function calcularScanner(){

const xgCasa = parseFloat(document.getElementById("xgCasa").value);
const xgFora = parseFloat(document.getElementById("xgFora").value);

const totalXg = xgCasa + xgFora;

let over05HT = Math.min(95,Math.round(totalXg*30));

let over25 = Math.min(95,Math.round(totalXg*22));

let btts = Math.min(95,Math.round(
((xgCasa+xgFora)/3)*70
));

let scoreScanner =
Math.round(
(over05HT + over25 + btts)/3
);

let status = "🔴 EVITAR";
let classe = "reprovado";

if(scoreScanner >= 80){
status = "🟢 APROVADO";
classe = "aprovado";
}
else if(scoreScanner >= 65){
status = "🟡 ATENÇÃO";
classe = "alerta";
}

document.getElementById("resultado").innerHTML = `

<div class="card">

<h2>Resultado Scanner AntiFraude</h2>

<div class="box">
<b>Over 0.5 HT:</b> ${over05HT}%
</div>

<div class="box">
<b>BTTS:</b> ${btts}%
</div>

<div class="box">
<b>Over 2.5:</b> ${over25}%
</div>

<div class="box">
<b>Scanner AntiBlefe:</b> ${scoreScanner}/100
</div>

<div class="box">
<b>Status:</b>
<span class="${classe}">
${status}
</span>
</div>

<div class="box">
<b>Placares Mais Prováveis</b><br><br>

1x1 → 14%<br>
2x1 → 12%<br>
1x0 → 11%<br>
2x0 → 10%<br>
0x1 → 8%
</div>

</div>

`;
}

</script>

</body>
</html>
